
name: Generate GitHub Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: Thecodingmindtm
          outputs: |
            dist/github-snake.svg?color_snake=%23C8FF3D&color_dots=%230D1117,%231B2B16,%233A5A24,%237EA832,%23C8FF3D
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23C8FF3D

      - name: Publish snake animation
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
